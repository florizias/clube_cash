name: clubcash
description: ""
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.0
  flutter_svg: ^2.2.3
  brasil_fields: ^1.18.0
  shared_preferences: ^2.5.4
  image: ^4.9.1
  http: ^1.6.0
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

  cloud_firestore: ^6.1.2
  firebase_core: ^4.11.0
  firebase_auth: ^6.1.4
  cloud_functions: ^6.0.6
  firebase_storage: ^13.0.6

  firebase_auth_web: ^6.1.2
  google_sign_in: ^7.2.0

  flutter_riverpod: ^3.2.0
  go_router: ^17.0.1
  file_picker: ^12.0.0-beta.7
  image_picker: ^1.2.1
  mobile_scanner: ^7.2.0
  google_mlkit_barcode_scanning: ^0.15.0
  share_plus: ^13.2.0
  url_launcher: ^6.3.2
  geocoding: ^5.0.0
  geolocator: ^14.0.3

  dotted_border: ^3.1.0
  dropdown_search: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/app/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/app/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#000000"
  image: assets/app/splash_logo.png

  android: true
  ios: false

  android_12:
    color: "#000000"
    image: assets/app/splash_logo.png
